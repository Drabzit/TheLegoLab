<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Explore Builds - The LEGO Lab</title>
  <link rel="stylesheet" href="Styles/style.css" />
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f8f8f8;
      margin: 0;
      text-align: center;
    }
    header, footer {
      padding: 20px;
    }
    h1 {
      margin: 0;
      font-size: 2rem;
    }
    p.description {
      margin: 10px 0 30px;
      font-size: 1rem;
    }
    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 0 20px;
    }
    .build-tile {
      width: 120px;
      height: 120px;
      background-color: #ddd;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: bold;
      color: #333;
      text-decoration: none;
      transition: background-color 0.3s ease;
    }
    .build-tile:hover {
      background-color: #ccc;
    }
    .nav-home {
      display: inline-block;
      margin-top: 30px;
      padding: 10px 20px;
      font-size: 1rem;
      background-color: #00aaff;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }
    .nav-home:hover {
      background-color: #007acc;
    }
  </style>
</head>
<body>

  <header>
    <h1>🧱 Explore Builds</h1>
    <p class="description">Click on a name to view its custom LEGO plaque and building instructions.</p>
  </header>

  <main>
    <div class="gallery">
      <a class="build-tile" href="builder.html?design=kirby">K</a>
      <a class="build-tile" href="builder.html?design=krystal">K</a>
      <a class="build-tile" href="builder.html?design=jackson">J</a>
      <a class="build-tile" href="builder.html?design=andy">A</a>
      <a class="build-tile" href="builder.html?design=riley">R</a>
      <a class="build-tile" href="builder.html?design=grayson">G</a>
      <a class="build-tile" href="builder.html?design=easton">E</a>
    </div>

    <a class="nav-home" href="index.html">Return to Home</a>
  </main>

  <footer>
    <p>&copy; 2025 The LEGO Lab</p>
  </footer>

</body>
</html>
