<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>About - The LEGO Lab</title>
  <link rel="stylesheet" href="Styles/style.css" />
  <style>
    body {
      background-color: #f0f0f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    header {
      padding: 20px;
    }

    h1 {
      color: #333;
    }

    .content {
      padding: 30px;
    }

    .nav-buttons {
      margin-top: 40px;
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    .nav-buttons a {
      text-decoration: none;
    }

    .nav-button {
      padding: 10px 20px;
      font-size: 1rem;
      background-color: #00aaff;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .nav-button:hover {
      background-color: #007acc;
    }

    footer {
      margin-top: 40px;
      padding: 20px;
      font-size: 0.9rem;
      color: #555;
    }
  </style>
</head>
<body>
  <header>
    <img src="assets/images/logo.png" alt="The LEGO Lab Logo" width="120">
    <h1>🧪 The LEGO Lab</h1>
    <p>Celebrating creativity one brick at a time.</p>
  </header>

  <main>
    <div class="content">
      <h2>Our Story</h2>
      <p><em>This section is dedicated to telling our LEGO Lab journey — from the first brick to our latest builds. A place for passion, creativity, and a bit of magic. (You can add your story here.)</em></p>
    </div>

    <div class="nav-buttons">
      <a href="index.html"><button class="nav-button">🏠 Return Home</button></a>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 The LEGO Lab</p>
  </footer>
</body>
</html>
