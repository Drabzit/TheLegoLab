<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Lego Lab</title>
  <link rel="stylesheet" href="styles/style.css" />
  <script src="scripts/script.js" defer></script>
</head>

<body>

  <!-- Container for centering all content -->
  <div class="page-container">
    <header>
      <img src="assets/images/logo.png" alt="The Lego Lab Logo" width="120">
      <h1>
        <span class="emoji-flip">🧪</span> The LEGO Lab <span class="emoji-flip">🧪</span>
      </h1>
      
      <p>Create your own LEGO name plaque!</p>
    </header>

    <main>
      <input type="text" id="textInput" placeholder="Type Your Name e.g. Chris" />
      <br/>
      <button id="generateButton">Generate Build</button>

      <!-- Preview Section -->
      <section id="preview">
        <h2>🔍 Preview</h2>
        <a id="builderLink" href="#" target="_blank" title="Click to open in Builder">
          <img id="previewImage" src="" alt="Design Preview" width="400" />
        </a>
      </section>
    </main>

    <div id="output-section"></div>

    <!-- Navigation Buttons -->
    <div class="nav-buttons">
      <a href="explore.html"><button class="nav-button">Explore Builds</button></a>
      <a href="about.html"><button class="nav-button">About</button></a>
    </div>

    <!-- Back to Top Button -->
    <a href="#top" class="back-to-top" title="Back to top">&#8679;</a>

    <footer>
      <p>&copy; 2025 The LEGO Lab</p>
    </footer>
  </div>

</body>
</html>
