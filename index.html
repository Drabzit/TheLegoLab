<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The LEGO Lab - Create Your Plaque</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header>
    <h1>🧪 The LEGO Lab</h1>
    <p>Create your own LEGO name plaque!</p>
  </header>

  <main>
    <section id="generator">
      <label for="nameInput">Enter a name:</label>
      <input type="text" id="nameInput" placeholder="e.g. Chris" />
      <button id="generateBtn">Generate Preview</button>
    </section>

    <section id="preview" style="margin-top: 2rem; display: none;">
      <h2>🔍 Preview</h2>
      <img id="previewImage" src="" alt="Design Preview" width="400" style="border: 2px solid #ccc; border-radius: 8px;" />
      <div style="margin-top: 1rem;">
        <a id="builderLink" class="btn" href="#" target="_blank">🧱 Open in Builder</a>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 The LEGO Lab</p>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const generateBtn = document.getElementById('generateBtn');
      const nameInput = document.getElementById('nameInput');
      const previewImage = document.getElementById('previewImage');
      const builderLink = document.getElementById('builderLink');
      const previewSection = document.getElementById('preview');

      generateBtn.addEventListener('click', () => {
        const name = nameInput.value.trim() || 'custom';
        const safeName = encodeURIComponent(name.toLowerCase());

        // Update image and link
        previewImage.src = `assets/images/sample_${safeName}_preview.png`;
        previewImage.alt = `${name} Desk Plaque Preview`;
        builderLink.href = `builder.html?design=${safeName}`;
        
        // Reveal preview
        previewSection.style.display = 'block';
      });
    });
  </script>
</body>
</html>
