<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Lego Lab</title>
  <link rel="stylesheet" href="Styles/style.css" />
  <style>
    body {
      background-color: #f0f0f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    header {
      padding: 20px;
    }

    h1 {
      color: #333;
    }

    #textInput {
      width: 80%;
      max-width: 400px;
      padding: 12px 20px;
      margin: 20px auto;
      border: none;
      border-radius: 25px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      font-size: 1rem;
    }

    #generateButton {
      padding: 12px 24px;
      font-size: 1rem;
      background-color: #ffcc00;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    #generateButton:hover {
      background-color: #e6b800;
    }

    #output-section {
      margin-top: 30px;
      padding: 20px;
    }

    .nav-buttons {
      margin-top: 40px;
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    .nav-buttons a {
      text-decoration: none;
    }

    .nav-button {
      padding: 10px 20px;
      font-size: 1rem;
      background-color: #00aaff;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .nav-button:hover {
      background-color: #007acc;
    }

    table {
      margin: 0 auto;
      border-collapse: collapse;
      width: 90%;
    }

    table, th, td {
      border: 1px solid #ccc;
    }

    th, td {
      padding: 10px;
    }

    img {
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <header>
    <img src="assets/images/logo.png" alt="The Lego Lab Logo" width="120">
    <h1>The Lego Lab</h1>
  </header>

  <main>
    <input type="text" id="textInput" placeholder="Type a name e.g. Chris" />
    <br/>
    <button id="generateButton">Generate Build</button>

    <div id="previewSection" style="display: none; text-align: center; margin-top: 20px;">
        <h3>Preview</h3>
        <a href="builder.html?design=chris">
            <img src="assets/images/sample_chris_preview.png" alt="Chris Desk Plaque Preview" width="300" style="cursor: pointer; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.2);">
        </a>
    </div>
    

    <div id="output-section"></div>

    <div class="nav-buttons">
      <a href="explore.html"><button class="nav-button">Explore Builds</button></a>
      <a href="builder.html"><button class="nav-button">Start Building</button></a>
      <a href="about.html"><button class="nav-button">About</button></a>
    </div>
  </main>

  <script src="Scripts/script.js"></script>
</body>
</html>
